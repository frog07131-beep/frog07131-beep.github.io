<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLUG IN - 首頁</title>
    <link rel="icon" href="./img/button-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/home.css">
</head>
<body>

  <!-- 精準品牌橘 (#E5550D) SVG 濾鏡：將幾何字母 PNG 精確著色為 #E5550D -->
  <svg width="0" height="0" style="position:absolute;pointer-events:none;" aria-hidden="true">
    <defs>
      <filter id="home-orange-tint" color-interpolation-filters="sRGB">
        <feColorMatrix type="matrix" values="0 0 0 0 0.898039  0 0 0 0 0.333333  0 0 0 0 0.050980  0 0 0 1 0"/>
      </filter>
    </defs>
  </svg>

  <!-- ==================== 頂部導覽列 (右上漢堡選單：兩黑一白) ==================== -->
  <header class="top-nav">
    <a href="./index.html" class="nav-logo" aria-label="PLUG IN 首頁">
      <img src="./img/button-logo.svg" alt="PLUG IN Logo">
    </a>

    <button type="button" id="menu-btn" class="nav-menu-btn" aria-label="開啟選單" aria-expanded="false">
      <span class="menu-bar bar-orange"></span>
      <span class="menu-bar bar-orange"></span>
      <span class="menu-bar bar-white"></span>
    </button>
  </header>

  <!-- ==================== 側邊選單遮罩 (全站統一 5 項 + 橘色箭頭) ==================== -->
  <aside class="menu-drawer" id="menu-drawer" aria-hidden="true">
    <div class="menu-drawer-backdrop" id="menu-backdrop"></div>
    <nav class="menu-drawer-panel" aria-label="網站選單">
      <button type="button" class="menu-close-btn" id="menu-close-btn" aria-label="關閉選單">✕</button>
      <ul class="menu-nav-list">
        <li>
          <a href="./guide.html?view=map">
            <span>插頭世界地圖</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
        <li>
          <a href="./guide.html?view=gallery&spec=all&page=1">
            <span>插頭圖鑑</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
        <li>
          <a href="./travel.html">
            <span>旅行查詢器</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
        <li>
          <a href="#" class="is-coming-soon" aria-disabled="true" title="尚未製作，敬請期待" onclick="return false;">
            <span>資訊與文章</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
        <li>
          <a href="./quiz.html">
            <span>用電安全隨堂考</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- ==================== 0-0 首頁主視覺 (依 Figma 0-0 畫面構成) ==================== -->
  <main class="hero">
    <!-- 橘底 + 黑色流線面板底圖 -->
    <img class="hero-bg" src="./img/home-bg-panel.png" alt="" aria-hidden="true">

    <!-- 左上品牌字標 PLUG IN (x=12.5%, y=22.6%) -->
    <h1 class="hero-title" aria-label="PLUG IN">
      <span class="hero-word">
        <img src="./img/letter-P.png" alt="P">
        <img src="./img/letter-L.png" alt="L">
        <img src="./img/letter-U.png" alt="U">
        <img src="./img/letter-G.png" alt="G">
      </span>
      <span class="hero-word-gap" aria-hidden="true"></span>
      <span class="hero-word">
        <img src="./img/letter-I.png" alt="I">
        <img src="./img/letter-N.png" alt="N">
      </span>
    </h1>

    <!-- 副標題：關於插頭的大小事 (x=12.9%, y=36.6%) -->
    <p class="hero-subtitle">關於插頭的大小事</p>

    <!-- 黑色面板內四項水平功能導覽 (x=12.5%, y=68%) -->
    <nav class="hero-nav" aria-label="主要功能導覽">
      <a href="./guide.html?view=map" class="hero-nav-link">插頭圖鑑</a>
      <a href="./travel.html" class="hero-nav-link">旅行查詢器</a>
      <a href="#" class="hero-nav-link is-coming-soon" aria-disabled="true" title="尚未製作，敬請期待" onclick="return false;">資訊&amp;文章</a>
      <a href="./quiz.html" class="hero-nav-link">隨堂考</a>
    </nav>

    <!-- 右下角橘色四圓品牌標誌 (x=74.6%, y=64.8%，內嵌 SVG 供四圓順時針循環位移) -->
    <svg class="hero-logo" viewBox="0 0 70 70" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PLUG IN 標誌">
      <path class="hero-logo-piece hero-logo-tl" d="M31 15.5C31 24.0604 24.0604 31 15.5 31C6.93959 31 0 24.0604 0 15.5C0 6.93959 6.93959 0 15.5 0C24.0604 0 31 6.93959 31 15.5Z" fill="#E5550D"/>
      <path class="hero-logo-piece hero-logo-tr" d="M62 15.5C62 11.3579 58.6421 8 54.5 8C50.3579 8 47 11.3579 47 15.5C47 19.6421 50.3579 23 54.5 23V31C45.9396 31 39 24.0604 39 15.5C39 6.93959 45.9396 0 54.5 0C63.0604 0 70 6.93959 70 15.5C70 24.0604 63.0604 31 54.5 31V23C58.6421 23 62 19.6421 62 15.5Z" fill="#E5550D"/>
      <path class="hero-logo-piece hero-logo-bl" d="M23 54.5C23 50.3579 19.6421 47 15.5 47C11.3579 47 8 50.3579 8 54.5C8 58.6421 11.3579 62 15.5 62V70C6.93959 70 0 63.0604 0 54.5C0 45.9396 6.93959 39 15.5 39C24.0604 39 31 45.9396 31 54.5C31 63.0604 24.0604 70 15.5 70V62C19.6421 62 23 58.6421 23 54.5Z" fill="#E5550D"/>
      <path class="hero-logo-piece hero-logo-br" d="M70 54.5C70 63.0604 63.0604 70 54.5 70C45.9396 70 39 63.0604 39 54.5C39 45.9396 45.9396 39 54.5 39C63.0604 39 70 45.9396 70 54.5Z" fill="#E5550D"/>
    </svg>

    <!-- 左下角橘底上的兩顆黑色圓點裝飾 (與 0-0 畫面一致) -->
    <div class="hero-bottom-dots" aria-hidden="true">
      <span class="hero-dot"></span>
      <span class="hero-dot"></span>
    </div>
  </main>

  <script src="./js/home.js"></script>
</body>
</html>
