<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PLUG IN - 旅行查詢器</title>
    <link rel="icon" href="./img/button-logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/travel.css">
</head>
<body>

  <!-- ==================== 頂部導覽列 ==================== -->
  <header class="top-nav">
    <div class="nav-left">
      <a href="./index.html" class="nav-logo" aria-label="PLUG IN 首頁">
        <img src="./img/button-logo.svg" alt="PLUG IN Logo">
      </a>
      <h1 class="main-title">旅行查詢器</h1>
    </div>

    <button type="button" id="menu-btn" class="nav-menu-btn" aria-label="開啟選單" aria-expanded="false">
      <span class="menu-bar bar-orange"></span>
      <span class="menu-bar bar-orange"></span>
      <span class="menu-bar bar-white"></span>
    </button>
  </header>

  <!-- ==================== 側邊選單遮罩 ==================== -->
  <aside class="menu-drawer" id="menu-drawer" aria-hidden="true">
    <div class="menu-drawer-backdrop" id="menu-backdrop"></div>
    <nav class="menu-drawer-panel" aria-label="網站選單">
      <button type="button" class="menu-close-btn" id="menu-close-btn" aria-label="關閉選單">✕</button>
      <ul class="menu-nav-list">
        <li>
          <a href="./guide.html?view=map">
            <span>插頭世界地圖</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
        <li>
          <a href="./guide.html?view=gallery&spec=all&page=1">
            <span>插頭圖鑑</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
        <li>
          <a href="./travel.html">
            <span>旅行查詢器</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
        <li>
          <a href="#" class="is-coming-soon" aria-disabled="true" title="尚未製作，敬請期待" onclick="return false;">
            <span>資訊與文章</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
        <li>
          <a href="./quiz.html">
            <span>用電安全隨堂考</span>
            <img src="./img/arrow-menu.svg" alt="" class="menu-nav-arrow" aria-hidden="true">
          </a>
        </li>
      </ul>
    </nav>
  </aside>

  <!-- ==================== 主體內容 ==================== -->
  <main class="canvas">
    <!-- 主視覺區塊 -->
    <section class="query-grid" aria-label="旅行查詢器">

      <!-- 中排：高度 135h，左右內縮 80w -->
      <div class="row-middle">
        <div class="search-action-area">

          <!-- ==================== 出發地選單框 ==================== -->
          <div class="input-pill" id="origin-pill">
            <div class="pill-trigger" id="origin-trigger" role="button" tabindex="0" aria-label="選擇出發地">
              <span class="pill-text" id="origin-text" data-placeholder="出發地">出發地</span>
              <span class="pill-sublabel" aria-hidden="true">出發地</span>
            </div>

            <div class="dropdown-panel" id="origin-dropdown">
              <div class="dropdown-cap">你想從哪裡出發</div>
              <ul class="option-list" id="origin-list">
                <li class="option-item" data-value="TW" data-label="臺灣">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>台灣 (TW)</span>
                </li>
                <li class="option-item" data-value="JP" data-label="日本">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>日本 (JP)</span>
                </li>
                <li class="option-item" data-value="US" data-label="美國">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>美國 (US)</span>
                </li>
                <li class="option-item" data-value="CN" data-label="中國">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>中國 (CN)</span>
                </li>
                <li class="option-item" data-value="UK" data-label="英國">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>英國 (UK)</span>
                </li>
              </ul>
              <div class="dropdown-cap dropdown-cap-bottom"></div>
            </div>
          </div>

          <!-- ==================== 中間交換按鈕 ==================== -->
          <button type="button" id="btn-swap" class="btn-swap" aria-label="交換出發地與目的地">
            <img src="./img/button-compare-arrows.svg" alt="交換出發地與目的地">
          </button>

          <!-- ==================== 目的地選單框 ==================== -->
          <div class="input-pill" id="dest-pill">
            <div class="pill-trigger" id="dest-trigger" role="button" tabindex="0" aria-label="選擇目的地">
              <span class="pill-text" id="dest-text" data-placeholder="目的地">目的地</span>
              <span class="pill-sublabel" aria-hidden="true">目的地</span>
            </div>

            <div class="dropdown-panel" id="dest-dropdown">
              <div class="dropdown-cap">你想去哪裡</div>
              <ul class="option-list" id="dest-list">
                <li class="option-item" data-value="TW" data-label="臺灣">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>台灣 (TW)</span>
                </li>
                <li class="option-item" data-value="JP" data-label="日本">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>日本 (JP)</span>
                </li>
                <li class="option-item" data-value="US" data-label="美國">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>美國 (US)</span>
                </li>
                <li class="option-item" data-value="CN" data-label="中國">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>中國 (CN)</span>
                </li>
                <li class="option-item" data-value="UK" data-label="英國">
                  <img src="./img/location.svg" alt="" class="option-icon">
                  <span>英國 (UK)</span>
                </li>
              </ul>
              <div class="dropdown-cap dropdown-cap-bottom"></div>
            </div>
          </div>

        </div>

        <!-- 查詢按鈕 -->
        <button type="button" id="search-btn" class="btn-submit">查詢</button>
      </div>

      <!-- 下排：高度 180h (與上排同高) -->
      <footer class="row-bottom">
        <!-- 左框：長 484w -->
        <div class="box-guide-label">
          <span>使用說明</span>
        </div>
        <!-- 右框：長 1155w -->
        <div class="box-guide-steps">
          <ol class="step-list">
            <li>01 選擇出發與目的地</li>
            <li>02 點擊查詢</li>
            <li>03 檢視轉接器與用電指引</li>
          </ol>
        </div>
      </footer>

    </section>
  </main>

  <!-- 原生 JavaScript 互動控制 -->
  <script src="./js/script.js"></script>
</body>
</html>
